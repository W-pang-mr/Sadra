<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--b1:#2481cc;--b2:#3390ec;--tx:#222;--mut:#707579;--grn:#2eaf4f;--red:#ff4d4f;--grad:linear-gradient(135deg,#2481cc,#3390ec)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:Inter,Roboto,-apple-system,"Segoe UI",sans-serif;color:var(--tx);min-height:100vh}
button{font-family:inherit;border:0;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),opacity .18s ease,background .2s ease,box-shadow .2s ease}
button:active,.tx:active,.mi:active{transform:scale(.94)}
.app{max-width:480px;margin:0 auto;padding:12px 16px 60px;animation:fadeIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;height:52px}
.top h1{font-size:26px;margin:0;font-weight:700;animation:slideDown .4s cubic-bezier(.2,.8,.2,1)}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.ib{background:none;font-size:22px;padding:8px 10px;color:var(--tx);border-radius:50%;transition:transform .2s,background .2s}
.ib:active{background:rgba(0,0,0,.06)}
.card{position:relative;height:200px;border-radius:28px;background:linear-gradient(135deg,#1e5cbe,#4ba3e3);color:#fff;padding:24px;overflow:hidden;box-shadow:0 12px 30px rgba(30,92,190,.3);animation:cardIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:none}}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.35),transparent 45%),repeating-radial-gradient(circle at 70% 60%,rgba(255,255,255,.07) 0 2px,transparent 2px 9px);pointer-events:none}
.card:after{content:"";position:absolute;top:-50%;left:-60%;width:40%;height:200%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);transform:rotate(20deg);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.bal{position:absolute;left:24px;top:52px;display:flex;align-items:center;gap:10px;font-size:42px;font-weight:700;z-index:1;animation:balPop .5s .15s both}
@keyframes balPop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.bal small{font-size:30px;font-weight:600;color:#d3ebff}
.usd{position:absolute;left:24px;top:112px;color:#d3ebff;font-size:20px;font-weight:600;z-index:1;animation:fadeIn .5s .25s both}
.hd{position:absolute;left:24px;bottom:22px;font-family:monospace;font-weight:700;font-size:14px;z-index:1;animation:fadeIn .5s .3s both}
.addr{position:absolute;right:14px;top:16px;bottom:16px;writing-mode:vertical-rl;font-family:monospace;font-size:12px;opacity:.75;word-break:break-all;line-height:1.15;z-index:1}
.qr{position:absolute;right:58px;top:50%;transform:translateY(-50%);width:60px;height:54px;border-radius:16px;background:rgba(255,255,255,.88);font-size:24px;z-index:1;transition:transform .2s,background .2s}
.qr:active{transform:translateY(-50%) scale(.9)}
.row{display:flex;gap:12px;margin:16px 0}
.btn{flex:1;border-radius:30px;background:var(--grad);color:#fff;font-size:18px;font-weight:600;height:58px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(36,129,204,.35);animation:btnIn .5s .2s both}
@keyframes btnIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.btn.full{width:100%;flex:none}.btn:disabled{opacity:.45;box-shadow:none}
.btn.ghost{background:#e5eefa;color:var(--b1);box-shadow:none}
.list{background:var(--card);border-radius:24px;padding:4px 0;overflow:hidden;animation:fadeIn .5s .3s both}
.tx{display:flex;align-items:center;gap:14px;padding:13px 16px;border-bottom:1px solid #eef0f3;transition:background .2s,transform .15s;animation:txIn .4s both}
@keyframes txIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.tx:nth-child(1){animation-delay:.05s}.tx:nth-child(2){animation-delay:.1s}.tx:nth-child(3){animation-delay:.15s}.tx:nth-child(4){animation-delay:.2s}.tx:nth-child(5){animation-delay:.25s}
.tx:active{background:#eaf2fb}.tx:last-child{border:0}
.ava{width:48px;height:48px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;transition:transform .2s}
.ava.in{background:linear-gradient(135deg,#2eaf4f,#52c96f)}
.tx .m{flex:1;min-width:0}.t1{font-size:17px;font-weight:600}.t2{color:var(--mut);font-size:14px}.t3{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;font-size:17px}.amt.in{color:var(--grn)}
.empty{padding:28px;text-align:center;color:var(--mut);animation:fadeIn .4s}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .28s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:22px 20px 30px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet-bg.show .sheet{transform:none}
.sheet h2{margin:0 0 12px}
.abox{word-break:break-all;background:var(--bg);border-radius:16px;padding:14px;font-family:monospace;font-size:14px;text-align:center;animation:fadeIn .3s}
#menuBg{position:fixed;inset:0;z-index:45;display:none}#menuBg.show{display:block}
#menu{position:absolute;top:60px;right:14px;width:260px;background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.18);overflow:hidden;opacity:0;transform:scale(.85);transform-origin:top right;transition:opacity .22s,transform .22s cubic-bezier(.2,.8,.2,1)}
#menuBg.show #menu{opacity:1;transform:none}
.mi{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:16px;border-bottom:1px solid #f0f2f5;transition:background .2s,transform .15s}
.mi:active{background:#eaf2fb}.mi:last-child{border:0}.mi small{display:block;color:var(--grn);font-size:12px}
.page{position:fixed;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1);z-index:40;overflow:auto}
.page.show{transform:none}.page.kp{padding-bottom:350px}
.pin{max-width:480px;margin:0 auto;padding:8px 16px 30px}
.hdr{display:flex;align-items:center;gap:10px;height:52px;font-size:20px;font-weight:700}
.rec{background:#fff;border-radius:22px;padding:14px;margin-top:6px;animation:fadeIn .35s}
.badge{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.badge .ava{width:44px;height:44px;font-size:16px;font-weight:700}
.badge b{display:block}.badge span{color:var(--mut);font-size:13px;font-family:monospace}
input{width:100%;border:1.5px solid #e2e6ea;border-radius:14px;padding:13px;font-size:16px;background:#f9fafb;outline:none;font-family:inherit;color:var(--tx);transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--b2);box-shadow:0 0 0 3px rgba(51,144,236,.15)}
.amtbox{text-align:center;margin:26px 0 8px}
.amtn{display:inline-flex;align-items:center;gap:10px;font-size:52px;font-weight:700;color:var(--tx)}
.amtn small{font-size:24px;color:var(--mut);font-weight:600}
.pop{animation:pop .2s cubic-bezier(.2,.8,.2,1)}@keyframes pop{from{transform:scale(.9);opacity:.7}to{transform:none;opacity:1}}
.shake{animation:shake .4s ease}@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.conv{text-align:center;color:var(--mut);font-size:17px;transition:opacity .2s}
.info{text-align:center;color:var(--mut);font-size:14px;margin:8px 0 4px}
.warn{text-align:center;color:var(--red);font-size:14px;font-weight:600;height:0;overflow:hidden;opacity:0;transition:all .25s}
.warn.show{height:22px;opacity:1;margin:6px 0}
#kp{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:60;box-shadow:0 -8px 30px rgba(0,0,0,.08)}
#kp.show{transform:none}
.keys{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:56px;border-radius:16px;background:#f4f6f9;font-size:26px;font-weight:600;color:var(--tx);transition:transform .15s,background .15s}
.key:active{background:#d9e8f7;transform:scale(.93)}
.done{grid-column:1/-1;height:54px;font-size:18px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 6px}
textarea{width:100%;min-height:100px;border:1.5px solid #e2e6ea;border-radius:14px;padding:13px;font-size:16px;background:#f9fafb;outline:none;font-family:inherit;resize:none;transition:border-color .2s}
textarea:focus{border-color:var(--b2)}
.center{max-width:480px;margin:0 auto;padding:56px 20px 120px;animation:fadeIn .45s}.center h1{text-align:center}.center p{text-align:center;color:var(--mut)}
.msg{margin-top:12px;font-size:15px;text-align:center;min-height:20px;word-break:break-word}.err{color:var(--red)}.ok{color:var(--grn)}
.link{background:none;color:var(--red);font-size:15px;margin-top:18px;width:100%}
.sp{width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,24px);background:rgba(34,34,34,.92);color:#fff;padding:12px 20px;border-radius:24px;font-size:15px;opacity:0;transition:all .28s cubic-bezier(.2,.8,.2,1);z-index:90;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#libStatus{display:none!important}
</style>
</head>
<body>
<div id="libStatus"></div>
<div id="toast"></div>

<div id="setup" class="center" style="display:none">
  <h1>💎 Import Wallet</h1><p>Enter your 12 (or 24) secret words.</p>
  <label>Secret words</label>
  <textarea id="words" placeholder="word1 word2 word3 ..." autocapitalize="none" autocomplete="off" spellcheck="false"></textarea>
  <label>Passcode (encrypts the words on this device)</label>
  <input id="pass1" type="password" placeholder="Passcode (min 4 chars)">
  <input id="pass2" type="password" placeholder="Repeat passcode" style="margin-top:10px">
  <div style="height:16px"></div><button class="btn full" id="importBtn">Import</button><div id="setupMsg" class="msg"></div>
</div>

<div id="unlock" class="center" style="display:none">
  <h1>💎 Wallet</h1><p>Enter your passcode</p>
  <input id="unlockPass" type="password" placeholder="Passcode">
  <div style="height:16px"></div><button class="btn full" id="unlockBtn">Unlock</button><div id="unlockMsg" class="msg"></div>
  <button class="link" id="forgetBtn">Remove wallet from this device</button>
</div>

<div id="main" class="app" style="display:none">
  <div class="top"><h1>Wallet</h1><div><button class="ib" id="refreshBtn">⟳</button><button class="ib" id="menuBtn">⋮</button></div></div>
  <div class="card">
    <div class="bal"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#bfe3ff"/><path d="M2 9h20M9 3l3 6 3-6M12 21 9 9m3 12 3-12" stroke="#fff" stroke-width="1" fill="none"/></svg><span id="balN">0</span><small>TON</small></div>
    <div class="usd" id="usd">$0.00</div>
    <div class="hd">@GIFTSDouble</div>
    <button class="qr" id="qrBtn">▣</button>
    <div class="addr" id="cardAddr"></div>
  </div>
  <div class="row"><button class="btn" id="addBtn">⊕ Add Funds</button><button class="btn" id="sendBtn">➤ Send</button></div>
  <div class="list" id="txList"><div class="empty">Loading…</div></div>
</div>

<div id="menuBg"><div id="menu">
  <button class="mi" style="width:100%;background:none;text-align:left" data-m="cur">💲 Currency</button>
  <button class="mi" style="width:100%;background:none;text-align:left" data-m="lock">🔒 Passcode Lock</button>
  <button class="mi" style="width:100%;background:none;text-align:left" data-m="keys">🔑 Keys &amp; Backup</button>
  <button class="mi" style="width:100%;background:none;text-align:left" data-m="apps"><span>🔗 Connected Apps<small>● STON.fi</small></span></button>
  <button class="mi" style="width:100%;background:none;text-align:left" data-m="what">❓ What is Wallet?</button>
</div></div>

<div class="sheet-bg" id="recvBg"><div class="sheet">
  <h2>Add Funds</h2><p style="color:var(--mut);margin-top:0">Send TON to this address:</p>
  <div class="abox" id="recvAddr"></div><div style="height:14px"></div>
  <button class="btn full" id="copyBtn">Copy address</button><div style="height:10px"></div>
  <button class="btn full ghost" id="recvClose">Close</button>
</div></div>

<div class="page" id="sendPage"><div class="pin">
  <div class="hdr"><button class="ib" id="backBtn">←</button>Send money to</div>
  <div class="rec">
    <div class="badge"><div class="ava" id="rAva">?</div><div><b id="rName">Recipient</b><span id="rAddr">Enter address below</span></div></div>
    <input id="toAddr" placeholder="Wallet address (UQ… / EQ…)" autocomplete="off" autocapitalize="none">
    <input id="memo" placeholder="Memo (optional)" style="margin-top:8px">
  </div>
  <div class="amtbox" id="amtBox"><div class="amtn" id="amtN"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#3390ec"/><path d="M2 9h20M9 3l3 6 3-6" stroke="#fff" stroke-width="1" fill="none"/></svg><span id="amtV">0</span><small>TON</small></div></div>
  <div class="conv" id="conv">= $0.00</div>
  <div class="warn" id="warn">Insufficient funds</div>
  <div class="info" id="balInfo">Balance: 0 TON</div>
  <div class="info">Network fee: \~0.005 TON</div>
  <div style="height:14px"></div>
  <button class="btn full" id="goBtn" disabled>Continue</button>
</div></div>

<div id="kp"><div class="keys" id="keys"></div></div>

<script>
var $=function(i){return document.getElementById(i)};
var API="https://toncenter.com/api/v2",API_KEY="e08b96c939bcca03c136cbc8e48e0f49d4b622013cf97b7fa00f8ad553ff9910";
var KEY="ton_wallet_enc_v1",CHOICE="ton_wallet_choice_v1",FEE="0.01";
var words=null,wallet=null,kp0=null,address="",balNano=0n,client=null,TON=null,CR=null,price=0,amt="0",wasBad=false;

function setStatus(t,c){/* status banner removed */}
function toast(t){var e=$("toast");e.textContent=t;e.className="show";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=""},2200)}
window.addEventListener("error",function(e){if(!e.message||/^Script error/.test(e.message))return});
window.addEventListener("unhandledrejection",function(e){});

/* ---- libraries ---- */
var TU=["https://esm.sh/@ton/ton@15","https://esm.sh/@ton/ton@15.2.0","https://cdn.jsdelivr.net/npm/@ton/ton@15/+esm","https://fastly.jsdelivr.net/npm/@ton/ton@15/+esm","https://esm.run/@ton/ton@15"];
var CU=["https://esm.sh/@ton/crypto@3","https://esm.sh/@ton/crypto@3.3.0","https://cdn.jsdelivr.net/npm/@ton/crypto@3/+esm","https://fastly.jsdelivr.net/npm/@ton/crypto@3/+esm","https://esm.run/@ton/crypto@3"];
async function tryImp(urls,ok,lb,log){for(var i=0;i<urls.length;i++){try{var m=await import(urls[i]);if(!ok(m))throw new Error("export missing");return m}catch(e){log.push("FAIL "+urls[i].replace("https://","")+" -> "+(e&&e.message?e.message.slice(0,50):e))}}return null}
async function loadLibs(){var log=[];
 try{if(!window.Buffer){var b=await import("https://esm.sh/buffer@6.0.3");window.Buffer=b.Buffer||(b.default&&b.default.Buffer)}}catch(e){}
 TON=await tryImp(TU,function(m){return m.WalletContractV5R1&&m.WalletContractV4&&m.TonClient},"ton",log);
 CR=TON&&await tryImp(CU,function(m){return m.mnemonicToPrivateKey&&m.keyPairFromSeed},"crypto",log);
 if(!TON||!CR){throw new Error("libs failed")}
 client=new TON.TonClient({endpoint:API+"/jsonRPC",apiKey:API_KEY})}
var libsReady=loadLibs();libsReady.catch(function(){});

/* ---- encryption ---- */
var enc=new TextEncoder(),dec=new TextDecoder();
function b64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function unb64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
async function dk(p,salt){var m=await crypto.subtle.importKey("raw",enc.encode(p),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:150000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function encr(t,p){var s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await dk(p,s);var c=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},k,enc.encode(t)));return JSON.stringify({s:b64(s),i:b64(iv),c:b64(c)})}
async function decr(bl,p){var o=JSON.parse(bl),k=await dk(p,unb64(o.s));return dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(o.i)},k,unb64(o.c)))}

/* ---- key derivation ---- */
function toBuf(u){return window.Buffer?window.Buffer.from(u):u}
async function hm(k,d){var key=await crypto.subtle.importKey("raw",k,{name:"HMAC",hash:"SHA-512"},false,["sign"]);return new Uint8Array(await crypto.subtle.sign("HMAC",key,d))}
async function bipKp(w){var m=await crypto.subtle.importKey("raw",enc.encode(w.join(" ").normalize("NFKD")),"PBKDF2",false,["deriveBits"]);
 var seed=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode("mnemonic"),iterations:2048,hash:"SHA-512"},m,512));
 var I=await hm(enc.encode("ed25519 seed"),seed),k=I.slice(0,32),c=I.slice(32),path=[44,607,0];
 for(var i=0;i<3;i++){var x=(path[i]|0x80000000)>>>0,d=new Uint8Array(37);d.set(k,1);d[33]=x>>>24&255;d[34]=x>>>16&255;d[35]=x>>>8&255;d[36]=x&255;I=await hm(c,d);k=I.slice(0,32);c=I.slice(32)}
 return CR.keyPairFromSeed(toBuf(k))}
var CANDS=[{id:"ton-v5",d:"ton",v:"V5R1"},{id:"bip-v5",d:"bip",v:"V5R1"},{id:"ton-v4",d:"ton",v:"V4R2"},{id:"bip-v4",d:"bip",v:"V4R2"}];
async function build(c,w){var kp=c.d==="ton"?await CR.mnemonicToPrivateKey(w):await bipKp(w);
 var wl=c.v==="V5R1"?TON.WalletContractV5R1.create({workchain:0,publicKey:kp.publicKey}):TON.WalletContractV4.create({workchain:0,publicKey:kp.publicKey});
 return{id:c.id,kp:kp,wallet:wl,addr:wl.address.toString({bounceable:false,urlSafe:true}),label:c.v+" / "+(c.d==="ton"?"TON-standard":"BIP39")}}

/* ---- helpers ---- */
function show(id){["setup","unlock","main"].forEach(function(x){$(x).style.display=x===id?"block":"none"})}
function setMsg(id,t,ok){var e=$(id);e.textContent=t;e.className="msg "+(ok?"ok":"err")}
function short(a){return a&&a.length>10?a.slice(0,4)+"…"+a.slice(-4):a}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
async function api(p){var r=await fetch(API+p+(p.indexOf("?")>-1?"&":"?")+"api_key="+API_KEY),t=await r.text(),j;try{j=JSON.parse(t)}catch(e){throw new Error("HTTP "+r.status+" "+t.slice(0,80))}if(!j.ok)throw new Error((j.error||"API error")+" (HTTP "+r.status+")");return j.result}

/* ---- wallet load ---- */
async function loadWallet(w){await libsReady;words=w;
 var saved=localStorage.getItem(CHOICE),chosen=null,list=[],notes=[];
 if(saved){var cf=CANDS.filter(function(c){return c.id===saved})[0];if(cf)chosen=await build(cf,words)}
 if(!chosen){for(var i=0;i<CANDS.length;i++){var cd=await build(CANDS[i],words);list.push(cd);
   try{var inf=await api("/getAddressInformation?address="+cd.addr),b=BigInt(inf.balance||"0");notes.push(cd.label+"\n"+cd.addr+"\nstate: "+inf.state+" | balance: "+TON.fromNano(b));if(inf.state!=="uninitialized"||b>0n){chosen=cd;break}}catch(e){notes.push(cd.label+"\n"+cd.addr+"\nAPI error: "+(e.message||e))}
   await sleep(300)}
  if(chosen){localStorage.setItem(CHOICE,chosen.id)}
  else{chosen=list[0]}
 }
 kp0=chosen.kp;wallet=chosen.wallet;address=chosen.addr;
 \( ("cardAddr").textContent=address; \)("recvAddr").textContent=address;show("main");refresh()}

async function refresh(){var rb=$("refreshBtn");rb.style.opacity=.4;

 if(!it.length){$("txList").innerHTML='<div class="empty">No transactions yet</div>';return}
