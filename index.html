<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f1f1f4;font-family:-apple-system,Roboto,"Segoe UI",sans-serif;color:#111;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;height:48px;margin-bottom:12px}
.top h1{font-size:24px;margin:0;font-weight:700}
.icon-btn{background:none;border:0;font-size:24px;padding:8px;color:#111}
.card{position:relative;height:200px;border-radius:32px;background:linear-gradient(135deg,#69c2f7 0%,#4a9be8 55%,#3d8ae0 100%);color:#fff;padding:24px;overflow:hidden;box-shadow:0 10px 30px rgba(61,138,224,.35)}
.card .bal{position:absolute;left:24px;top:58px;display:flex;align-items:center;gap:10px;font-size:44px;font-weight:700}
.card .bal span{font-size:44px}
.card .bal small{color:#cfeaff;font-size:44px;font-weight:600}
.card .usd{position:absolute;left:24px;top:116px;color:#d6efff;font-size:20px;font-weight:600}
.card .name{position:absolute;left:24px;bottom:22px;font-family:monospace;font-weight:700;font-size:15px;letter-spacing:.5px}
.card .addr{position:absolute;right:14px;top:16px;bottom:16px;writing-mode:vertical-rl;font-family:monospace;font-size:13px;color:#1d4fa8;opacity:.8;word-break:break-all;line-height:1.15}
.card .qr{position:absolute;right:62px;top:50%;transform:translateY(-50%);width:64px;height:56px;border-radius:14px;background:linear-gradient(#f5f5f5,#cfcfcf);display:flex;align-items:center;justify-content:center;border:0;font-size:26px}
.row{display:flex;gap:12px;margin:18px 0}
.btn{flex:1;border:0;border-radius:30px;background:#5577f5;color:#fff;font-size:20px;font-weight:600;height:64px}
.btn:active{opacity:.8}
.btn:disabled{opacity:.5}
.btn.full{width:100%;flex:none}
.btn.ghost{background:#e4e7fb;color:#3a57d8}
.list{background:#fff;border-radius:28px;padding:6px 0;overflow:hidden}
.tx{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #eee}
.tx:last-child{border-bottom:0}
.ava{width:52px;height:52px;border-radius:50%;background:linear-gradient(#3f9be8,#2f78d4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-size:18px;font-weight:600}
.tx .t2{color:#555;font-size:15px}
.tx .t3{color:#888;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;font-size:18px;display:flex;align-items:center;gap:4px}
.tx .amt.in{color:#2bb04a}
.empty{padding:30px;text-align:center;color:#888}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:22px 20px 30px;max-height:92vh;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:22px}
label{display:block;font-size:14px;color:#666;margin:12px 0 6px}
input,textarea{width:100%;border:1.5px solid #dde1ea;border-radius:16px;padding:14px;font-size:17px;background:#f7f8fb;outline:none;font-family:inherit;color:#111}
input:focus,textarea:focus{border-color:#5577f5}
textarea{min-height:110px;resize:none;direction:ltr}
.msg{margin-top:12px;font-size:15px;text-align:center;min-height:20px;word-break:break-word}
.err{color:#d93636}.ok{color:#2bb04a}
.center{max-width:480px;margin:0 auto;padding:60px 20px 120px}
.center h1{text-align:center}
.center p{text-align:center;color:#666}
.addr-box{word-break:break-all;background:#f1f3f9;border-radius:16px;padding:14px;font-family:monospace;font-size:15px;text-align:center}
.link{background:none;border:0;color:#d93636;font-size:15px;margin-top:20px;width:100%}
#libStatus{position:fixed;left:0;right:0;bottom:0;padding:8px 12px;font-size:12px;text-align:left;direction:ltr;background:#fff3cd;color:#664d03;z-index:20;word-break:break-word;max-height:38vh;overflow:auto;white-space:pre-wrap}
#libStatus.good{display:none}
#libStatus.bad{background:#f8d7da;color:#842029}
</style>
</head>
<body>

<div id="libStatus">Loading libraries…</div>

<!-- SETUP -->
<div id="setup" class="center" style="display:none">
  <h1>💎 Import Wallet</h1>
  <p>Enter your 12 (or 24) secret words. Wallet type: V5R1.</p>
  <label>Secret words</label>
  <textarea id="words" placeholder="word1 word2 word3 ..." autocapitalize="none" autocomplete="off" spellcheck="false"></textarea>
  <label>Set a passcode (encrypts the words on this device)</label>
  <input id="pass1" type="password" placeholder="Passcode (min 4 chars)">
  <input id="pass2" type="password" placeholder="Repeat passcode" style="margin-top:10px">
  <div style="height:16px"></div>
  <button class="btn full" id="importBtn">Import</button>
  <div id="setupMsg" class="msg"></div>
</div>

<!-- UNLOCK -->
<div id="unlock" class="center" style="display:none">
  <h1>💎 Wallet</h1>
  <p>Enter your passcode</p>
  <input id="unlockPass" type="password" placeholder="Passcode">
  <div style="height:16px"></div>
  <button class="btn full" id="unlockBtn">Unlock</button>
  <div id="unlockMsg" class="msg"></div>
  <button class="link" id="forgetBtn">Remove wallet from this device</button>
</div>

<!-- MAIN -->
<div id="main" class="app" style="display:none">
  <div class="top">
    <h1>Wallet</h1>
    <button class="icon-btn" id="refreshBtn" title="Refresh">⟳</button>
  </div>
  <div class="card">
    <div class="bal">💎 <span id="balInt">0</span><small id="balDec"></small><small style="font-size:30px;margin-left:2px">TON</small></div>
    <div class="usd" id="usd">$0.00</div>
    <div class="name" id="cardName">MY WALLET</div>
    <button class="qr" id="qrBtn">▣</button>
    <div class="addr" id="cardAddr"></div>
  </div>
  <div class="row">
    <button class="btn" id="addBtn">Add Funds</button>
    <button class="btn" id="sendBtn">Send</button>
  </div>
  <div class="list" id="txList"><div class="empty">Loading…</div></div>
  <button class="link" id="lockBtn" style="color:#888">Lock</button>
</div>

<!-- RECEIVE -->
<div class="sheet-bg" id="recvBg"><div class="sheet">
  <h2>Add Funds</h2>
  <p style="color:#666;margin-top:0">Send TON to this address:</p>
  <div class="addr-box" id="recvAddr"></div>
  <div style="height:14px"></div>
  <button class="btn full" id="copyBtn">Copy address</button>
  <div style="height:10px"></div>
  <button class="btn full ghost" data-close="recvBg">Close</button>
</div></div>

<!-- SEND -->
<div class="sheet-bg" id="sendBg"><div class="sheet">
  <h2>Send TON</h2>
  <label>Recipient address</label>
  <input id="toAddr" placeholder="UQ... / EQ..." autocomplete="off" autocapitalize="none">
  <label>Amount (TON) — <a href="#" id="maxLink" style="color:#5577f5;text-decoration:none">Max</a></label>
  <input id="amount" type="number" inputmode="decimal" step="any" placeholder="0.0">
  <label>Memo / comment (optional)</label>
  <input id="memo" placeholder="Memo">
  <div style="height:16px"></div>
  <button class="btn full" id="confirmSend">Send</button>
  <div style="height:10px"></div>
  <button class="btn full ghost" data-close="sendBg">Cancel</button>
  <div id="sendMsg" class="msg"></div>
</div></div>

<script>
var $ = function (id) { return document.getElementById(id); };
var API = "https://toncenter.com/api/v2";
var API_KEY = "e08b96c939bcca03c136cbc8e48e0f49d4b622013cf97b7fa00f8ad553ff9910";
var KEY = "ton_wallet_enc_v1";

var words = null, wallet = null, address = "", balanceNano = 0n, client = null;
var TON = null, CRYPTO = null;

/* ---------- on-screen status / debug ---------- */
function setStatus(text, cls) {
  var e = $("libStatus");
  e.textContent = text;
  e.className = cls || "";
}
window.addEventListener("error", function (e) { setStatus("Error: " + (e.message || e), "bad"); });
window.addEventListener("unhandledrejection", function (e) {
  setStatus("Error: " + (e.reason && e.reason.message ? e.reason.message : e.reason), "bad");
});

/* ---------- load TON libraries (many CDN fallbacks) ---------- */
var TON_URLS = [
  "https://esm.sh/@ton/ton@15",
  "https://esm.sh/@ton/ton@15.2.0",
  "https://esm.sh/@ton/ton",
  "https://cdn.jsdelivr.net/npm/@ton/ton@15/+esm",
  "https://fastly.jsdelivr.net/npm/@ton/ton@15/+esm",
  "https://gcore.jsdelivr.net/npm/@ton/ton@15/+esm",
  "https://esm.run/@ton/ton@15",
  "https://cdn.skypack.dev/@ton/ton@15",
  "https://esm.sh/@ton/ton@15.2.0?bundle"
];
var CRYPTO_URLS = [
  "https://esm.sh/@ton/crypto@3",
  "https://esm.sh/@ton/crypto@3.3.0",
  "https://esm.sh/@ton/crypto",
  "https://cdn.jsdelivr.net/npm/@ton/crypto@3/+esm",
  "https://fastly.jsdelivr.net/npm/@ton/crypto@3/+esm",
  "https://gcore.jsdelivr.net/npm/@ton/crypto@3/+esm",
  "https://esm.run/@ton/crypto@3",
  "https://cdn.skypack.dev/@ton/crypto@3",
  "https://esm.sh/@ton/crypto@3.3.0?bundle"
];

async function tryImport(urls, check, label, log) {
  for (var i = 0; i < urls.length; i++) {
    try {
      setStatus("Loading " + label + " (" + (i + 1) + "/" + urls.length + ")…\n" + log.join("\n"));
      var m = await import(urls[i]);
      if (!check(m)) throw new Error("export missing");
      log.push("OK  " + label + ": " + urls[i]);
      return m;
    } catch (e) {
      log.push("FAIL " + label + " #" + (i + 1) + " " + urls[i].replace("https://", "") + " -> " + ((e && e.message) ? e.message.slice(0, 60) : e));
    }
  }
  return null;
}

async function loadLibs() {
  var log = [];
  try {
    if (!window.Buffer) {
      var b = await import("https://esm.sh/buffer@6.0.3");
      window.Buffer = b.Buffer || (b.default && b.default.Buffer);
    }
  } catch (e) { log.push("buffer polyfill skipped"); }

  TON = await tryImport(TON_URLS, function (m) { return m.WalletContractV5R1 && m.TonClient; }, "ton", log);
  CRYPTO = TON && await tryImport(CRYPTO_URLS, function (m) { return m.mnemonicToPrivateKey; }, "crypto", log);

  if (!TON || !CRYPTO) {
    setStatus("Could not load libraries. Turn on VPN and reload.\n\n" + log.join("\n"), "bad");
    throw new Error("libs failed");
  }
  client = new TON.TonClient({ endpoint: API + "/jsonRPC", apiKey: API_KEY });
  setStatus("", "good");
}
var libsReady = loadLibs();
libsReady.catch(function () {});

/* ---------- crypto helpers ---------- */
var enc = new TextEncoder(), dec = new TextDecoder();
function b64(u) { var s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
function unb64(s) { var r = atob(s), u = new Uint8Array(r.length); for (var i = 0; i < r.length; i++) u[i] = r.charCodeAt(i); return u; }
async function deriveKey(pass, salt) {
  var m = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 150000, hash: "SHA-256" }, m, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function encrypt(text, pass) {
  var salt = crypto.getRandomValues(new Uint8Array(16));
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var k = await deriveKey(pass, salt);
  var ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, k, enc.encode(text)));
  return JSON.stringify({ s: b64(salt), i: b64(iv), c: b64(ct) });
}
async function decrypt(blob, pass) {
  var o = JSON.parse(blob);
  var k = await deriveKey(pass, unb64(o.s));
  var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(o.i) }, k, unb64(o.c));
  return dec.decode(pt);
}

/* ---------- screens ---------- */
function show(id) {
  ["setup", "unlock", "main"].forEach(function (x) { $(x).style.display = x === id ? "block" : "none"; });
}
function openSheet(id) { $(id).classList.add("show"); }
function closeSheet(id) { $(id).classList.remove("show"); }
document.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = function () { closeSheet(b.dataset.close); }; });

function setMsg(id, text, ok) { var e = $(id); e.textContent = text; e.className = "msg " + (ok ? "ok" : "err"); }
function short(a) { return a && a.length > 10 ? a.slice(0, 4) + "…" + a.slice(-4) : a; }

/* ---------- wallet ---------- */
async function loadWallet(w) {
  await libsReady;
  words = w;
  var kp = await CRYPTO.mnemonicToPrivateKey(words);
  wallet = TON.WalletContractV5R1.create({ workchain: 0, publicKey: kp.publicKey });
  address = wallet.address.toString({ bounceable: false, urlSafe: true });
  $("cardAddr").textContent = address;
  $("recvAddr").textContent = address;
  show("main");
  refresh();
}

async function getJson(path) {
  var sep = path.indexOf("?") > -1 ? "&" : "?";
  var r = await fetch(API + path + sep + "api_key=" + API_KEY);
  var txt = await r.text();
  var j;
  try { j = JSON.parse(txt); } catch (e) { throw new Error("HTTP " + r.status + " " + txt.slice(0, 80)); }
  if (!j.ok) throw new Error((j.error || "API error") + " (HTTP " + r.status + ")");
  return j.result;
}
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

async function refresh() {
  $("refreshBtn").style.opacity = .4;
  try {
    var bal = await getJson("/getAddressBalance?address=" + address);
    balanceNano = BigInt(bal);
    var t = TON.fromNano(balanceNano);
    var parts = t.split(".");
    $("balInt").textContent = parts[0];
    $("balDec").textContent = parts[1] ? "." + parts[1].slice(0, 2) : "";
    setStatus("", "good");
    fetch("https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd")
      .then(function (r) { return r.json(); }).then(function (p) {
        var price = p["the-open-network"].usd;
        $("usd").textContent = "$" + (parseFloat(t) * price).toFixed(2);
      }).catch(function () {});
  } catch (e) { setStatus("Balance error: " + (e.message || e), "bad"); }
  await sleep(400);
  try { renderTx(await getJson("/getTransactions?address=" + address + "&limit=20")); }
  catch (e) {
    $("txList").innerHTML = '<div class="empty">Could not load transactions</div>';
    setStatus("Transactions error: " + (e.message || e), "bad");
  }
  $("refreshBtn").style.opacity = 1;
}

function fmtDate(u) {
  return new Date(u * 1000).toLocaleString("en", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
}
function fmtAmt(v) { return parseFloat(TON.fromNano(BigInt(v))).toString(); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function renderTx(list) {
  var items = [];
  list.forEach(function (tx) {
    var inm = tx.in_msg;
    if (inm && inm.source) items.push({ dir: "in", addr: inm.source, val: inm.value, memo: inm.message, time: tx.utime });
    (tx.out_msgs || []).forEach(function (o) {
      if (o.destination) items.push({ dir: "out", addr: o.destination, val: o.value, memo: o.message, time: tx.utime });
    });
  });
  if (!items.length) { $("txList").innerHTML = '<div class="empty">No transactions yet</div>'; return; }
  $("txList").innerHTML = items.map(function (x) {
    return '<div class="tx">' +
      '<div class="ava">' + (x.dir === "in" ? "↓" : "↑") + '</div>' +
      '<div class="mid">' +
        '<div class="t1">' + esc(short(x.addr)) + '</div>' +
        '<div class="t2">' + (x.dir === "in" ? "Incoming transfer" : "Outgoing transfer") + '</div>' +
        '<div class="t3">' + fmtDate(x.time) + (x.memo ? " · " + esc(x.memo) : "") + '</div>' +
      '</div>' +
      '<div class="amt ' + (x.dir === "in" ? "in" : "") + '">' + (x.dir === "in" ? "+" : "−") + fmtAmt(x.val) + ' 💎</div>' +
    '</div>';
  }).join("");
}

/* ---------- send ---------- */
async function doSend() {
  var to = $("toAddr").value.trim();
  var amt = $("amount").value.trim();
  var memo = $("memo").value.trim();
  if (!to) return setMsg("sendMsg", "Enter recipient address", false);
  if (!amt || Number(amt) <= 0) return setMsg("sendMsg", "Enter a valid amount", false);

  var dest, bounce = false;
  try {
    try { var p = TON.Address.parseFriendly(to); dest = p.address; bounce = p.isBounceable; }
    catch (e1) { dest = TON.Address.parse(to); }
  } catch (e2) { return setMsg("sendMsg", "Invalid address", false); }

  var value;
  try { value = TON.toNano(amt); } catch (e3) { return setMsg("sendMsg", "Invalid amount", false); }
  if (value + TON.toNano("0.01") > balanceNano) return setMsg("sendMsg", "Insufficient balance (keep a little for fees)", false);

  $("confirmSend").disabled = true;
  setMsg("sendMsg", "Sending…", true);
  try {
    var kp = await CRYPTO.mnemonicToPrivateKey(words);
    var contract = client.open(wallet);
    var seqno = await contract.getSeqno();
    await contract.sendTransfer({
      seqno: seqno,
      secretKey: kp.secretKey,
      sendMode: TON.SendMode.PAY_GAS_SEPARATELY + TON.SendMode.IGNORE_ERRORS,
      messages: [TON.internal({ to: dest, value: value, bounce: bounce, body: memo || undefined })]
    });
    setMsg("sendMsg", "✅ Sent! It will show up in a few seconds.", true);
    $("toAddr").value = ""; $("amount").value = ""; $("memo").value = "";
    setTimeout(function () { closeSheet("sendBg"); $("sendMsg").textContent = ""; refresh(); }, 2500);
    setTimeout(refresh, 9000);
  } catch (e) {
    setMsg("sendMsg", "Error: " + (e.message || e), false);
    setStatus("Send error: " + (e.message || e), "bad");
  }
  $("confirmSend").disabled = false;
}

/* ---------- events ---------- */
$("importBtn").onclick = async function () {
  var w = $("words").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var p1 = $("pass1").value, p2 = $("pass2").value;
  if (w.length !== 12 && w.length !== 24) return setMsg("setupMsg", "Enter exactly 12 or 24 words", false);
  if (p1.length < 4) return setMsg("setupMsg", "Passcode must be at least 4 characters", false);
  if (p1 !== p2) return setMsg("setupMsg", "Passcodes don't match", false);
  setMsg("setupMsg", "Please wait…", true);
  try {
    await libsReady;
    localStorage.setItem(KEY, await encrypt(w.join(" "), p1));
    $("words").value = ""; $("pass1").value = ""; $("pass2").value = "";
    await loadWallet(w);
  } catch (e) { setMsg("setupMsg", "Error: " + (e.message || e), false); }
};

$("unlockBtn").onclick = async function () {
  setMsg("unlockMsg", "Please wait…", true);
  var txt;
  try { txt = await decrypt(localStorage.getItem(KEY), $("unlockPass").value); }
  catch (e) { return setMsg("unlockMsg", "Wrong passcode", false); }
  try {
    $("unlockPass").value = ""; $("unlockMsg").textContent = "";
    await loadWallet(txt.split(" "));
  } catch (e) { setMsg("unlockMsg", "Error: " + (e.message || e), false); }
};
$("unlockPass").addEventListener("keydown", function (e) { if (e.key === "Enter") $("unlockBtn").click(); });

$("forgetBtn").onclick = function () {
  if (confirm("Remove this wallet from this device? Make sure you have your secret words saved!")) {
    localStorage.removeItem(KEY); location.reload();
  }
};
$("lockBtn").onclick = function () { words = null; wallet = null; show("unlock"); };
$("refreshBtn").onclick = refresh;
$("addBtn").onclick = function () { openSheet("recvBg"); };
$("qrBtn").onclick = function () { openSheet("recvBg"); };
$("sendBtn").onclick = function () { $("sendMsg").textContent = ""; openSheet("sendBg"); };
$("confirmSend").onclick = doSend;
$("copyBtn").onclick = async function () {
  try { await navigator.clipboard.writeText(address); $("copyBtn").textContent = "Copied ✓"; }
  catch (e) { prompt("Copy address:", address); }
  setTimeout(function () { $("copyBtn").textContent = "Copy address"; }, 1500);
};
$("maxLink").onclick = function (e) {
  e.preventDefault();
  var m = balanceNano - TON.toNano("0.01");
  $("amount").value = m > 0n ? TON.fromNano(m) : "0";
};

/* ---------- start ---------- */
show(localStorage.getItem(KEY) ? "unlock" : "setup");
</script>
</body>
</html>
